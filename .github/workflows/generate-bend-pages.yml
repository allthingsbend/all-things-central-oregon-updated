name: Generate Bend Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install OpenAI package
        run: npm install openai

      - name: Generate pages
        run: node scripts/generate-bend-pages.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Commit generated pages
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add src/pages/bend
          git commit -m "Generate Bend guide pages" || echo "No changes to commit"
          git push
